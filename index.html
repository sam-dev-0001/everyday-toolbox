<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EverydayTool - Free Online Tools</title>
    <meta name="description" content="EverydayTool provides 60+ free, fast, and private online tools for images, PDFs, text manipulation, file management, developer utilities, and everyday calculations. 100% in-browser processing." />
    <link rel="canonical" href="https://everydaytool.pages.dev/" />
    
    <!-- Favicons & Brand Icons -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7C3AED" />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="EverydayTool - Free Online Tools" />
    <meta property="og:description" content="60+ free, fast, and private online utilities for images, PDFs, text, developer tools, and everyday calculations." />
    <meta property="og:url" content="https://everydaytool.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://everydaytool.pages.dev/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('et_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#070A14] text-slate-100 font-sans antialiased min-h-screen selection:bg-purple-600/30 selection:text-purple-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
